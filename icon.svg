<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#4de3ff"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#0a0620"/>
  <rect x="40" y="40" width="432" height="432" rx="90" fill="none" stroke="url(#bgGrad)" stroke-width="8" opacity="0.6"/>
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="280" font-weight="900" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">?</text>
</svg>